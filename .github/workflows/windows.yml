name: Windows build and checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: node scripts/prepare-pandoc.cjs
      - run: npm run build
      - run: npm test
        env:
          WRITELY_PANDOC: ${{ github.workspace }}\.tools\pandoc.exe
      - run: npx playwright install chromium
      - name: Test production UI in Chromium
        run: npm run test:e2e
      - name: Test real Windows desktop
        env:
          WRITELY_PANDOC: ${{ github.workspace }}\.tools\pandoc.exe
        run: npm run test:desktop
      - name: Test encrypted Windows workspace
        run: npm run test:secure-desktop
      - name: Package Windows x64
        run: npm exec electron-builder -- --win zip nsis --x64 --publish never
      - name: Test packaged Windows application
        env:
          ELECTRON_PATH: ${{ github.workspace }}\release\win-unpacked\Writely.exe
        run: npm run test:desktop
      - uses: actions/upload-artifact@v4
        with:
          name: Writely-Windows-x64
          path: |
            release/*.zip
            release/*.exe
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Desktop-test-evidence
          path: |
            work/secure-desktop/report.json
            work/secure-desktop/secure-desktop.png
            work/desktop-smoke/report.json
            work/desktop-smoke/desktop.png
            work/desktop-smoke/document.pdf
            work/desktop-smoke/preview.png
            work/desktop-smoke/mixed-layout.pdf
            work/desktop-smoke/references.pdf
            work/desktop-smoke/references.odt
