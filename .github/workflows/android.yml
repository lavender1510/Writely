name: Android build and WebView checks
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-36 build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
      - run: npm ci
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: 1
      - run: npm run android:sync
      - run: ./gradlew --no-daemon :app:assembleDebug :app:assembleDebugAndroidTest
        working-directory: android
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: |
            adb shell input keyevent KEYCODE_WAKEUP
            adb shell wm dismiss-keyguard
            # The disposable AOSP runner's Launcher3 can ANR during cold boot and
            # intercept test touches. Isolate only this unrelated launcher;
            # Writely/IME and application ANR detection remain fully enabled.
            adb shell pm disable-user --user 0 com.android.launcher3
            ./android/gradlew -p android --no-daemon -Pandroid.injected.androidTest.leaveApksInstalledAfterRun=true :app:connectedDebugAndroidTest
            mkdir -p work
            adb exec-out run-as de.writely.mobile cat no_backup/workspace.sealed > work/android-roundtrip.writely
            adb exec-out run-as de.writely.mobile tar -C no_backup -cf - books > work/android-books.tar
            mkdir -p work/android-books
            tar -xf work/android-books.tar -C work/android-books
            node --import tsx scripts/verify-android-roundtrip.mts
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Writely-Android-debug
          overwrite: true
          path: |
            android/app/build/outputs/apk/debug/*.apk
            android/app/build/reports/androidTests/
            android/app/build/outputs/androidTest-results/
            work/android-roundtrip.json
            work/android-roundtrip.writely
            work/android-book-roundtrip.writely
